apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-main
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-js
  namespace: gitlab-main
spec:
  replicas: 4
  selector:
    matchLabels:
      app: app-js
  template:
    metadata:
      labels:
        app: app-js
    spec:
      containers:
        - name: app
          image: mikesir87/cats:3.0
          imagePullPolicy: always
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: app-js
  namespace: gitlab-main
spec:
  type: NodePort
  selector:
    app: app-js
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30081
